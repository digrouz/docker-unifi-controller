        - name: {{ include "unifi-controller.fullname" . }}-svc
          port: 1900
          {{- if .Values.ingress.l2discovery.weight }}
          weight: {{ .Values.ingress.l2discovery.weight | int }}
          {{- end }}
{{- end }}
