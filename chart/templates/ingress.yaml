{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.webui.host }}
{{- fail "ingress.webui.host must be set when ingress.enabled is true" }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "unifi-controller.fullname" . }}-webui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "unifi-controller.labels" . | nindent 4 }}
  {{- if or .Values.ingress.middlewares .Values.ingress.annotations }}
  annotations:
    {{- with .Values.ingress.middlewares }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ . | join "," | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- if .Values.ingress.ingressClassName }}
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.webui.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "unifi-controller.fullname" . }}-webui-svc
                port:
                  name: webui
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.webui.host | quote }}
      secretName: {{ printf "%s-webui-tls" (include "unifi-controller.fullname" .) }}
  {{- end }}
{{- if .Values.ingress.api.traefik.entrypoint }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ include "unifi-controller.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  entryPoints:
    - {{ .Values.ingress.api.traefik.entrypoint }}
  routes:
    - match: HostSNI(`*`)
      {{- if .Values.ingress.api.priority }}
      priority: {{ .Values.ingress.api.priority | int }}
      {{- end }}
      services:
        - name: {{ include "unifi-controller.fullname" . }}-svc
          port: 8080
{{- end }}
{{- if .Values.ingress.webredirect.traefik.entrypoint }}
---
apiVersion: traefik.io/v1alpha1
